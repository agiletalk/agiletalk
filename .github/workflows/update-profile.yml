name: Update profile SVG

on:
  schedule:
    - cron: "2 21 * * *" # 매일 06:02 KST (UTC 21:02)
  workflow_dispatch: # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths:
      - generate_profile.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write # 기본 GITHUB_TOKEN으로 커밋/푸시 — 별도 시크릿 불필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate profile.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_profile.py > profile.svg

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh profile stats"
          git push
